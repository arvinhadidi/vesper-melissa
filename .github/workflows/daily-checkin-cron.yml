# Hourly trigger for /api/cron/daily-checkin. Lives here instead of
# vercel.json crons because the Vercel Hobby plan only allows daily
# schedules, and the check-in logic needs hourly runs to hit each
# user's preferred_checkin_time bucket.
#
# Requires a repo secret named CRON_SECRET matching the Vercel env var.
name: daily-checkin-cron

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call daily-checkin endpoint
        run: |
          curl -sS --fail-with-body --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://vesper.cards/api/cron/daily-checkin
